[project]
name = "hoops-pipeline"
version = "0.1.0"
description = "Nightly ESPN -> static JSON pipeline for the Hoops Analytics app"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hoops_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
