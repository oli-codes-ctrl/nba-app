name: Website

# Rebuilds and publishes the website when its code changes, against the data
# already published. The nightly data workflow also rebuilds the site after
# every data refresh, so the pages always match the data next to them.
on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: write

# Shared with nightly-data.yml: both replace the gh-pages branch, so they never run at once.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Load the published data
        # Everything on gh-pages except the data is the old site and is replaced.
        run: |
          git fetch --depth=1 origin gh-pages
          mkdir -p pages
          git archive FETCH_HEAD -- v1 v2 | tar -x -C pages
          test -f pages/v2/manifest.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and check the website
        working-directory: web
        env:
          HOOPS_DATA_URL: ${{ github.workspace }}/pages/v2
        run: |
          # Served next to the data: https://<owner>.github.io/<repo>/ (scheduled runs carry no repository
          # details in github.event, so both come from GITHUB_REPOSITORY).
          export NEXT_PUBLIC_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          export NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          npm ci
          npm test
          npm run build
          npm run check
          cp -r out/. ../pages/

      - name: Publish data and site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "Website ${{ github.sha }}"
