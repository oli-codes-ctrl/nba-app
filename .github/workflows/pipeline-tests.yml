name: Pipeline tests

on:
  pull_request:
    paths: ["pipeline/**"]
  push:
    branches: [master]
    paths: ["pipeline/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run pytest
        working-directory: pipeline
        run: uv run --python 3.12 --extra dev pytest -q
