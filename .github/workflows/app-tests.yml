name: App tests

on:
  pull_request:
    paths: ["app/**", "pipeline/hoops_pipeline/metrics.py"]
  push:
    branches: [master]
    paths: ["app/**", "pipeline/hoops_pipeline/metrics.py"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Jest
        run: npx jest --ci
