name: Nightly data

on:
  schedule:
    # ESPN's stats feeds finish updating some hours after the last game; on
    # 2026-11-04 the player totals only caught up around 16:00 UTC. The
    # pipeline publishes only once they have (exit 75 = not yet, exit 76 =
    # already published), so extra attempts are cheap no-ops. It also refuses
    # once any of today's games has finished, so late attempts can't label
    # today's results as yesterday's. GitHub often starts scheduled runs up
    # to an hour late. Only the last attempt (18:45) fails loudly.
    - cron: "15 10 * * *"
    - cron: "15 12 * * *"
    - cron: "15 14 * * *"
    - cron: "45 15 * * *"
    - cron: "15 17 * * *"
    - cron: "45 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if these games were already published"
        type: boolean
        default: false

permissions:
  contents: write

# Shared with site.yml: both replace the gh-pages branch, so they never run at once.
concurrency:
  group: gh-pages
  cancel-in-progress: false


jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Load pipeline state
        run: |
          mkdir -p .state
          if git ls-remote --exit-code --heads origin pipeline-state > /dev/null; then
            git fetch --depth=1 origin pipeline-state
            git archive FETCH_HEAD | tar -x -C .state
          else
            echo "No pipeline-state branch yet; starting fresh."
          fi

      - uses: astral-sh/setup-uv@v5

      - name: Run pipeline
        id: run
        working-directory: pipeline
        run: |
          set +e
          uv run --python 3.12 python -m hoops_pipeline nightly --state ../.state --out ../out ${{ inputs.force && '--force' || '' }}
          code=$?
          set -e
          case $code in
            0) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            76) echo "::notice::Last night's games are already published." ;;
            75)
              if [ "${{ github.event.schedule }}" = "45 18 * * *" ]; then
                echo "::error::ESPN's stats still haven't caught up with last night's games after the last attempt."
                exit 1
              fi
              echo "::notice::ESPN's stats haven't caught up yet; the next scheduled attempt will retry." ;;
            *) exit $code ;;
          esac

      - uses: actions/setup-node@v4
        if: steps.run.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the website from this data
        id: site
        if: steps.run.outputs.publish == 'true'
        # A broken site build must not hold back the data the app reads.
        continue-on-error: true
        working-directory: web
        env:
          HOOPS_DATA_URL: ${{ github.workspace }}/out/v2
        run: |
          # Served next to the data: https://<owner>.github.io/<repo>/ (scheduled runs carry no repository
          # details in github.event, so both come from GITHUB_REPOSITORY).
          export NEXT_PUBLIC_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          export NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          npm ci
          npm run build
          npm run check
          cp -r out/. ../out/

      - name: Keep the last published site if the build failed
        if: steps.run.outputs.publish == 'true' && steps.site.outcome == 'failure'
        run: |
          git fetch --depth=1 origin gh-pages
          mkdir -p last
          git archive FETCH_HEAD | tar -x -C last
          rm -rf last/v1 last/v2
          cp -r last/. out/
          echo "::warning::The website build failed; the data is published with the previous site."

      - name: Publish data and site to gh-pages
        if: steps.run.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "Data refresh"

      - name: Save pipeline state
        # After publishing, so a failed publish can't mark these games as done.
        # Single force-pushed commit so the branch never grows.
        if: steps.run.outputs.publish == 'true'
        working-directory: .state
        run: |
          git init -q -b pipeline-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pipeline state $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:pipeline-state

      - name: Fail loudly if the website build failed
        if: steps.site.outcome == 'failure'
        run: |
          echo "::error::The website build failed (see 'Build the website from this data'); the data was published with the previous site."
          exit 1
